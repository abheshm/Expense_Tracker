{% load static %}<!DOCTYPE html>
<html>
<head>
    <title>Transactions</title>
    <link rel="stylesheet" href="{% static 'expenses/transaction_list.css' %}">
    <style>
        body {
            text-align: center;
        }
        .button-container {
            display: inline-block;
        }
    </style>
</head>
<body>
    <img src="{% static 'images/trackify_logo.png' %}" alt="Trackify Logo" style="width: 250px; height: auto; margin-bottom: 25px;">
    
    <div style="margin-bottom: 20px;">
        <a href="/add/" style="background-color: #4CAF50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-right: 10px;">+ Add Transaction</a>
        <a href="/show_all/" style="background-color: #3498db; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">📊 Show All Data</a>
    </div>
    
    <h3>Summary</h3>
    <p>Total Income: ₹{{ total_income }}</p>
    <p>Total Expense: ₹{{ total_expense }}</p>
    <p><strong>Balance: ₹{{ balance }}</strong></p>

</body>
</html>
