<!DOCTYPE html>
<html>
<head>
    <title>Edit Transactions</title>
</head>
<body>

<h2>Edit Transaction</h2>

<form method="POST">
    {% csrf_token %}

    <label>Amount:</label>
    <input type="number" step="0.1" name="amount" value="{{ transaction.amount }}">
    <br><br>

    <label>Type:</label>
    <select name="type">
        <option value="income" {% if transaction.type == "income" %}selected{% endif %}>Income</option>
        <option value="expense" {% if transaction.type == "expense" %}selected{% endif %}>Expense</option>
    </select>
    <br><br>

    <label>Description:</label>
    <input type="text" name="description" value="{{ transaction.description }}">
    <br><br>

    <label>Date:</label>
    <input type="date" name="date" value="{{ transaction.date }}">
    <br><br>

    <button type="submit">Update</button>
</form>

<br>

<a href="/">Back</a>

</body>
</html>
